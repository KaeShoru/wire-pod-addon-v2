name: Build RK3588 Russian TTS

on:
  pull_request:
    branches:
      - main
    paths:
      - tts-rk3588/**
      - .github/workflows/tts-rk3588.yaml
  push:
    branches:
      - main
    paths:
      - tts-rk3588/**
      - .github/workflows/tts-rk3588.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kaeshoru/wire-pod-addon-v2
  MODEL_RELEASE: tts-dmitri-rk3588-v1
  MODEL_ARCHIVE: piper-ru_RU-dmitri-medium-rk3588-rknn-2.3.2.tar.gz
  RKNN_RUNTIME: librknnrt-2.3.2-aarch64.so

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Prepare pinned model and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tts-rk3588/model
          gh release download "${MODEL_RELEASE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${MODEL_ARCHIVE}" \
            --pattern "${RKNN_RUNTIME}" \
            --dir /tmp/vector-tts-assets
          tar -xzf "/tmp/vector-tts-assets/${MODEL_ARCHIVE}" \
            -C tts-rk3588/model
          cp "/tmp/vector-tts-assets/${RKNN_RUNTIME}" \
            tts-rk3588/librknnrt.so
          echo "db9ca3bc3fdbc3fbe9bd0565a2fdf856041a705737806940ab23a99d0497a74e  /tmp/vector-tts-assets/${MODEL_ARCHIVE}" | sha256sum -c -
          echo "d31fc19c85b85f6091b2bd0f6af9d962d5264a4e410bfb536402ec92bac738e8  tts-rk3588/librknnrt.so" | sha256sum -c -

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: tts-rk3588
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:tts-rk3588-0.1.0
            ${{ env.IMAGE }}:tts-rk3588-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Russian Piper TTS for Vector on RK3588 NPU
