name: Build OpenVoice Vector converter

on:
  pull_request:
    branches: [main]
    paths:
      - tts-openvoice/**
      - .github/workflows/tts-openvoice.yaml
  push:
    branches: [main]
    paths:
      - tts-openvoice/**
      - .github/workflows/tts-openvoice.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kaeshoru/wire-pod-addon-v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: tts-openvoice
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:tts-openvoice-0.1.2
            ${{ env.IMAGE }}:tts-openvoice-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OpenVoice V2 tone converter prototype for Vector
