worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8099;
        server_name _;

        # Home Assistant's Ingress proxy is the only allowed client.
        allow 172.30.32.2;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            # Wire-Pod uses root-relative links and API calls. Prefix them with
            # the per-session Ingress path supplied by Home Assistant.
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript text/javascript;
            sub_filter '"/' '"$http_x_ingress_path/';
            sub_filter "'/" "'$http_x_ingress_path/";
        }
    }
}
